<style>
:root{--bg:#F0EDE6;--card:#fff;--hd:#162B1E;--fg:#1A2E1A;--fg2:#3D5A3D;--mt:#8A9A8A;--ac:#C45D3E;--gn:#2D6B45;--gnl:#E8F5EC;--gnd:#162B1E;--bd:#D8D2C8;--dn:#B83226;--sh:0 1px 3px rgba(22,43,30,.08)}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;display:flex;flex-direction:column}
.top-bar{background:var(--hd);padding:15px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,.3)}

.content{flex:1;padding:20px;max-width:1200px;margin:0 auto;width:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;box-shadow:var(--sh);margin-bottom:20px}

.kpi-lbl{font-size:12px;color:var(--mt);font-weight:700}
h3{color:var(--gnd);margin-bottom:15px;font-size:18px}
h4{font-size:14px;color:var(--gnd);margin-bottom:12px}
.tbl-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--bd)}
table{width:100%;border-collapse:collapse;min-width:600px}
thead{background:var(--gnd);color:#fff}
th{padding:10px;font-size:12px;text-align:right}
td{padding:10px;font-size:12px;border-bottom:1px solid var(--bd);text-align:right}
.btn{padding:8px 16px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;color:#fff;display:inline-flex;align-items:center;gap:5px}
.btn-g{background:var(--gn)}.btn-d{background:var(--dn)}.btn-o{background:var(--card);border:1px solid var(--bd);color:var(--fg2)}
.empty{text-align:center;padding:30px;color:var(--mt)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:9999}
.overlay.open{display:flex}
.modal-box{background:var(--card);border-radius:18px;width:100%;max-width:500px;padding:25px;max-height:90vh;overflow-y:auto}
.fg{margin-bottom:15px}.fg label{display:block;font-size:11px;font-weight:700;margin-bottom:5px;color:var(--fg2)}
.fg input,.fg select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;font-size:13px}
.login-overlay{position:fixed;inset:0;background:var(--hd);display:flex;align-items:center;justify-content:center;z-index:9999}
.login-box{background:var(--card);border-radius:20px;padding:30px;width:100%;max-width:400px;text-align:center}
.toast-wrap{position:fixed;top:20px;left:20px;z-index:9998;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 16px;border-radius:8px;color:#fff;font-size:12px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.toast-s{background:var(--gn)}.toast-e{background:var(--dn)}
</style>

function initFirebase() {
    return new Promise(function(resolve) {
        if (typeof firebase !== 'undefined' && firebase.initializeApp) {
            try {
                var firebaseConfig = { apiKey: "AIzaSyDKWp5k6gnf7bF0Mlyz8lebeW6_j2mVQmQ", authDomain: "nursery-erp-63713.firebaseapp.com", projectId: "nursery-erp-63713", storageBucket: "nursery-erp-63713.firebasestorage.app", messagingSenderId: "804355879833", appId: "1:804355879833:web:bcb2a9c047d28069231908" };
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();

async function checkLogin() {

async function saveOwnerConfig() {

    if(!pass) { toast('أدخل كلمة المرور', 'e'); return; }
    try {
        var user = firebase.auth().currentUser;
        await db.collection("system_control").doc("owner_config").set({ email: OWNER_EMAIL, password: pass, owner_uid: user ? user.uid : 'unknown' });
        localStorage.setItem('nr_owner_session', 'active'); localStorage.setItem('elen_owner_done', '1');
        document.getElementById('login-overlay').style.display = 'none';
        renderAdmin();
        toast('✅ تم التثبيت بنجاح', 's');
    } catch(e) { toast('خطأ', 'e'); }
}

function openTenantPage() {
    window.open(getTenantPageUrl(), '_blank');
}
function getTenantPageUrl() {
    return window.location.href.replace(/owner\.html.*/, 'tenant.html');
}
// فتح صفحة المستأجرين مع تمرير رمز المنشأة للدخول المباشر
function openTenantFor(tenantId) {
    localStorage.setItem('elen_installed', '1');
    var url = getTenantPageUrl() + '?tenant_id=' + encodeURIComponent(tenantId);
    window.open(url, '_blank');
}
function doLogout() {
    localStorage.removeItem('nr_owner_session');
    location.reload();
}

async function renderAdmin() {
    document.getElementById('login-overlay').style.display = 'none';
    var h = '<div class="kpi-grid"><div class="kpi-card"><div class="kpi-icon" style="background:var(--gnl);color:var(--gn)">🏢</div><div><div class="kpi-val" id="kpi-total">-</div><div class="kpi-lbl">منشآت مفعلة</div></div></div><div class="kpi-card"><div class="kpi-icon" style="background:#FDE8E8;color:var(--dn)">⏳</div><div><div class="kpi-val" id="kpi-pending">-</div><div class="kpi-lbl">طلبات معلقة</div></div></div></div>';
    h += '<div class="card"><h3>📩 طلبات التفعيل الجديدة (رسائل SMS الواردة من العملاء)</h3><div style="font-size:11px;color:var(--mt);margin-bottom:10px">تصل عبر الرسائل النصية على هاتفك. بعد الموافقة يستطيع العميل تعيين كلمة السر والدخول.</div><div class="tbl-wrap"><table><thead><tr><th>اسم المنشأة</th><th>البريد</th><th>الهاتف</th><th>الرمز</th><th>التاريخ</th><th>إجراء</th></tr></thead><tbody id="pending-tbody"><tr><td colspan="6"><div class="empty">جاري التحميل...</div></td></tr></tbody></table></div></div>';
    h += '<div class="card"><h3>🏢 المنشآت المفعلة</h3><div style="margin-bottom:15px"><button class="btn btn-g" onclick="showTenantModal()">➕ إضافة منشأة يدوياً</button></div><div style="display:flex;align-items:center;gap:14px;margin-bottom:15px;background:var(--gnl);border:1px solid var(--gn);border-radius:12px;padding:12px 16px"><span style="font-size:12px;font-weight:700">💬 زر التواصل مع الشركة في صفحة المستأجرين:</span><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="support-toggle" onchange="toggleSupportBtn(this.checked)" style="width:18px;height:18px"><span id="support-toggle-lbl" style="font-size:12px;font-weight:700">جاري التحميل...</span></label></div><div class="tbl-wrap"><table><thead><tr><th>اسم المنشأة</th><th>الرمز</th><th>النشاط</th><th>نهاية الاشتراك</th><th>إجراء</th></tr></thead><tbody id="active-tbody"><tr><td colspan="5"><div class="empty">جاري التحميل...</div></td></tr></tbody></table></div></div>';
    h += '<div class="card"><h3>💬 طلبات التواصل والتوثيق (من المستأجرين)</h3><div class="tbl-wrap"><table><thead><tr><th>رقم الطلب</th><th>المنشأة</th><th>الرمز</th><th>البريد</th><th>الهاتف</th><th>الموضوع</th><th>الحالة</th><th>التاريخ</th><th>إجراء</th></tr></thead><tbody id="support-tbody"><tr><td colspan="9"><div class="empty">جاري التحميل...</div></td></tr></tbody></table></div></div>';
    document.getElementById('admin-content').innerHTML = h;
    loadTenants();

async function loadTenants() {
    try {
        try {
            var cfg = await db.collection("system_control").doc("owner_config").get();
            if(cfg.exists && cfg.data()) {
                var data = cfg.data();
                var enabled = data.supportEnabled !== false;
                var el = document.getElementById('support-toggle');
                if(el) { el.checked = enabled; document.getElementById('support-toggle-lbl').innerText = enabled ? '✅ مفعّل' : '🔴 معطّل'; }
            }
        } catch(e) {}
        var doc = await db.collection("system_control").doc("all_tenants").get();
        var arr = (doc.exists && doc.data().list) ? doc.data().list : [];
        window.tenantsCache = arr;
        var today = new Date().toISOString().split('T')[0];
        var active = arr.filter(t => t.status === 'active');
        var pending = arr.filter(t => t.status === 'pending');
        var pendingReqs = window._pendingReqs || [];
        document.getElementById('kpi-total').innerText = active.length;
        document.getElementById('kpi-pending').innerText = pending.length + pendingReqs.length;
        
        var pH = '';
        if(pending.length === 0) pH = '<tr><td colspan="4"><div class="empty">لا يوجد طلبات</div></td></tr>';
        pending.forEach(t => { pH += '<tr><td>'+t.name+'</td><td>'+t.phone+'</td><td>'+t.id+'</td><td><button class="btn btn-g" onclick="approveTenant(\''+t.id+'\')">✅ تفعيل</button></td></tr>'; });
        document.getElementById('pending-tbody').innerHTML = pH;
        var aH = '';
        if(active.length === 0) aH = '<tr><td colspan="5"><div class="empty">لا توجد منشآت مفعلة</div></td></tr>';
        active.forEach(t => {
            var exp = t.renewalDate && t.renewalDate < today;
            aH += '<tr><td>'+t.name+'</td><td>'+t.id+'</td><td>'+(t.type||'nursery')+'</td><td>'+(t.renewalDate||'-')+'</td><td><button class="btn btn-g" onclick="openTenantFor(\''+t.id+'\')">🖥️ دخول</button> <button class="btn btn-o" onclick="showTenantModal(\''+t.id+'\')">✏️ تعديل</button> <button class="btn btn-o" onclick="openFeatsModal(\''+t.id+'\')" title="تفعيل وإيقاف الميزات">⚙️ ميزات</button></td></tr>';
        });
        document.getElementById('active-tbody').innerHTML = aH;
        loadSupportRequests();
        loadActivationRequests();
    } catch(e) { toast('خطأ في تحميل البيانات', 'e'); }
}

async function loadActivationRequests() {
    try {
        var snap = await db.collection("tenants_requests").get();
        var reqs = [];
        snap.forEach(function(d) {
            var dd = d.data();
            if(dd && (dd.status === 'pending' || dd.status === 'approved' || dd.status === 'awaiting_password')) reqs.push(dd);
        });
        reqs.sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); });
        window._pendingReqs = reqs;
        var pH = '';
        if(reqs.length === 0) pH = '<tr><td colspan="6"><div class="empty">لا توجد طلبات تفعيل جديدة - الطلبات تظهر هنا بعد إرسال العميل رسالة SMS</div></td></tr>';
        reqs.forEach(function(r) {
            var d = new Date(r.createdAt);
            var ds = d ? (d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()) : '-';
            var isApproved = r.status === 'approved';
            var isWaiting = (r.status === 'approved' || r.status === 'awaiting_password');
            pH += '<tr' + (isWaiting ? ' style="background:rgba(46,125,50,0.07)"' : '') + '>';
            pH += '<td>'+H(r.name||'-')+'</td>';
            pH += '<td dir="ltr">'+H(r.email||'-')+'</td>';
            pH += '<td dir="ltr">'+H(r.phone||'-')+'</td>';
            pH += '<td dir="ltr"><span id="ac-code-'+H(r.id)+'"><b>'+(isApproved ? H(r.activationCode||'-') : H(r.id))+'</b></span>'+(isApproved ? ' <button class="btn btn-o" style="font-size:9px;padding:3px 7px" onclick="toggleShowCode(\''+H(r.id)+'\',\''+H(r.activationCode||'')+'\')">👁</button>' : '')+'</td>';
            pH += '<td>'+ds+'</td>';
            if(isApproved) {
                                pH += '<td><span style="color:var(--gnd);font-size:11px">✅ وافق المالك (في انتظار دخول العميل)</span><br><button class="btn btn-g" style="margin-top:4px;font-size:10px;padding:6px 10px" onclick="sendCodeToClient(\''+r.id+'\')">📩 إرسال الرمز للعميل</button> <button class="btn btn-o" style="margin-top:4px;font-size:10px;padding:6px 10px" onclick="copyActCodeDirect(\''+r.id+'\')">📋 نسخ الرمز</button></td>';
            } else {
                pH += '<td><button class="btn btn-g" onclick="approveNewTenant(\''+r.id+'\')">✅ موافقة</button> <button class="btn btn-d" onclick="rejectNewTenant(\''+r.id+'\')">❌ رفض</button></td>';
            }
            pH += '</tr>';
        });
        document.getElementById('pending-tbody').innerHTML = pH;
        var kpiEl = document.getElementById('kpi-pending');
        if(kpiEl) kpiEl.innerText = (parseInt(kpiEl.innerText)||0) + reqs.length;
    } catch(e) { if(document.getElementById('pending-tbody')) document.getElementById('pending-tbody').innerHTML = '<tr><td colspan="6"><div class="empty">خطأ في التحميل</div></td></tr>'; }
}
function genActivationCode() {
    var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    var code = 'ACT-';
    for(var i = 0; i < 5; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
    return code;
}
async function approveNewTenant(id) {
    try {
        var reqRef = db.collection("tenants_requests").doc(id);
        var reqDoc = await reqRef.get();
        if(!reqDoc.exists) { toast('الطلب غير موجود', 'e'); return; }
        var data = reqDoc.data();
        var activationCode = genActivationCode();
        var cloudId = db.collection("tenants").doc().id;
        await reqRef.update({ status: 'approved', cloudId: cloudId, activationCode: activationCode, approvedAt: new Date().toISOString() });
        await db.collection("tenants").doc(cloudId).set({
            cloudId: cloudId, name: data.name, email: data.email, phone: data.phone,
            status: 'awaiting_password', requestCode: id, activationCode: activationCode, passwordHash: '', createdAt: new Date().toISOString()
        });
        var _tDoc = await db.collection("system_control").doc("all_tenants").get();
        var _tArr = (_tDoc.exists && _tDoc.data().list) ? _tDoc.data().list : [];
        if(!_tArr.find(x => x.id === cloudId)) {
            _tArr.push({ id: cloudId, name: data.name, email: data.email, phone: data.phone, type: 'tenant', renewalDate: new Date(new Date().setFullYear(new Date().getFullYear() + 1)).toISOString().split('T')[0], status: 'pending', createdAt: new Date().toISOString() });
            await db.collection("system_control").doc("all_tenants").set({ list: _tArr }, { merge: true });
        }
        toast('✅ تمت الموافقة - أرسل رمز التفعيل ' + activationCode + ' إلى العميل برسالة نصية', 's', 6000);
        await loadTenants();
        var actMsg = 'رمز تفعيل نظام ELEN SOFT المحاسبي\u000A' + data.name + '\u000Aالرمز: ' + activationCode + '\u000Aأدخل الرمز في شاشة التفعيل بالنظام';
        var actPhoneDisp = '+' + (data.phone || '');
        var actH = '<div style="font-size:12px;color:var(--fg);text-align:right">تمت الموافقة على المنشأة <b>'+H(data.name)+'</b>. أرسل هذا الرمز إلى العميل برسالة نصية:<br><b dir="ltr" style="font-size:20px;color:var(--gnd);display:inline-block;margin:8px 0">'+activationCode+'</b></div>';
        actH += '<div style="background:#FFF9E6;border:1px solid #E6B800;border-radius:10px;padding:10px;margin:10px 0;font-size:11px;color:#7A5C00;white-space:pre-wrap;text-align:right">'+actMsg+'</div>';
        actH += '<button class="btn btn-g" style="width:100%" onclick="window.location.href=\u0027sms:'+actPhoneDisp+'?body='+encodeURIComponent(actMsg)+'\u0027">📲 فتح الرسائل وإرسال الرمز</button>';
        actH += '<button class="btn btn-o" style="width:100%;margin-top:6px" onclick="copyActCode(\u0027'+actMsg+'\u0027)">📋 نسخ نص الرسالة</button>';
        actH += '<button class="btn btn-o" style="width:100%;margin-top:6px" onclick="copyActCode(\u0027'+activationCode+'\u0027)">📋 نسخ الرمز فقط</button>';
        openModal('✅ رمز التفعيل', actH);
    } catch(e) { toast('خطأ في الموافقة', 'e'); }
}
async function rejectNewTenant(id) {
    try {
        await db.collection("tenants_requests").doc(id).delete();
        toast('❌ تم رفض الطلب وحذفه', 's');
        loadTenants();
    } catch(e) { toast('خطأ', 'e'); }
}
async function sendCodeToClient(code) {
    try {
        var reqDoc = await db.collection("tenants_requests").doc(code).get();
        if(!reqDoc.exists) { toast('الطلب غير موجود', 'e'); return; }
        var d = reqDoc.data();
        var actCode = d.activationCode || '';
        var msg = 'رمز تفعيل نظام ELEN SOFT المحاسبي\\u000A' + d.name + '\\u000Aالرمز: ' + actCode + '\\u000Aأدخل الرمز في شاشة التفعيل بالبريد الإلكتروني المسجل';
        var smsText = 'رمز تفعيل نظام ELEN SOFT المحاسبي\u000A' + d.name + '\u000Aالرمز: ' + actCode + '\u000Aأدخل الرمز في شاشة التفعيل بالبريد الإلكتروني المسجل';
        var phoneDisp = '+' + (d.phone || '');
        var h = '<div style="font-size:12px;color:var(--fg);text-align:right">أرسل هذا الرمز إلى العميل برسالة نصية:<br><b dir="ltr" style="font-size:16px;color:var(--gnd)">'+actCode+'</b></div>';
        h += '<div style="background:#FFF9E6;border:1px solid #E6B800;border-radius:10px;padding:10px;margin:10px 0;font-size:11px;color:#7A5C00;white-space:pre-wrap;text-align:right">'+smsText+'</div>';
        h += '<button class="btn btn-g" style="width:100%" onclick="window.location.href=\u0027sms:'+phoneDisp+'?body='+encodeURIComponent(smsText)+'\u0027">📲 فتح الرسائل وإرسالها للعميل</button>';
        h += '<button class="btn btn-o" style="width:100%;margin-top:6px" onclick="copyActCode(\u0027'+smsText+'\u0027)">📋 نسخ نص الرسالة</button>';
        openModal('إرسال رمز التفعيل إلى العميل', h);
    } catch(e) { toast('خطأ', 'e'); }
}
function copyActCode(txt) {
    if(navigator.clipboard) { navigator.clipboard.writeText(txt).then(function(){ toast('✅ تم نسخ نص الرسالة', 's'); }); }
    else { var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('✅ تم نسخ نص الرسالة', 's'); }
}
async function loadSupportRequests() {
    try {
        var doc = await db.collection("system_control").doc("support_requests").get();
        var list = (doc.exists && doc.data().list) ? doc.data().list : [];
        var sorted = list.slice().sort(function(a,b){return (b.createdAt||'').localeCompare(a.createdAt||'');});
        var h = '';
        if(sorted.length === 0) h = '<tr><td colspan="9"><div class="empty">لا توجد طلبات تواصل</div></td></tr>';
        sorted.forEach(function(x) {
            var d = new Date(x.createdAt);
            var ds = d ? (d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()) : '-';
            var topicCls = {'تفعيل خدمة':'bg-c','صيانة':'bg-y','شكوى':'bg-r'}[x.topic]||'';
            h += '<tr>';
            h += '<td dir="ltr">'+x.id+'</td>';
            h += '<td>'+H(x.tenantName||'-')+'</td>';
            h += '<td dir="ltr">'+H(x.tenantId||'-')+'</td>';
            h += '<td dir="ltr">'+H(x.tenantEmail||'-')+'</td>';
            h += '<td>'+H(x.tenantPhone||'-')+'</td>';
            h += '<td><span class="bdg '+(topicCls==='bg-r'?'bdg-r':topicCls==='bg-y'?'bdg-y':'bdg-c')+'">'+x.topic+'</span></td>';
            h += '<td><span class="bdg '+(x.status==='جديد'?'bdg-y':x.status==='تم'?'bdg-g':'bdg-c')+'">'+x.status+'</span></td>';
            h += '<td>'+ds+'</td>';
            h += '<td><button class="btn btn-o" onclick="showSupportDetailOwner(\''+x.id+'\')">عرض</button></td>';
            h += '</tr>';
        });
        window._supOwnerList = sorted;
        document.getElementById('support-tbody').innerHTML = h;
    } catch(e) { if(document.getElementById('support-tbody')) document.getElementById('support-tbody').innerHTML = '<tr><td colspan="9"><div class="empty">خطأ في التحميل</div></td></tr>'; }
}

function showSupportDetailOwner(id) {
    var x = (window._supOwnerList||[]).find(function(s){return s.id===id;});
    if(!x) return;
    var d = new Date(x.createdAt);
    var ds = d ? (d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes()) : '-';
    var h = '<div style="background:var(--gnd);color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:11px">';
    h += '<div style="color:#A5D6A7;font-weight:800;margin-bottom:5px">بيانات موثقة (إثبات الطلب - غير قابلة للتعديل)</div>';
    h += '<div>رقم الطلب: <b dir="ltr">'+x.id+'</b> | الحالة: <b>'+x.status+'</b></div>';
    h += '<div>المنشأة: <b>'+H(x.tenantName)+'</b> | الرمز: <b dir="ltr">'+H(x.tenantId)+'</b></div>';
    h += '<div>البريد: <b>'+H(x.tenantEmail||'-')+'</b> | الهاتف: <b>'+H(x.tenantPhone||'-')+'</b></div>';
    h += '<div>التاريخ: <b>'+ds+'</b></div>';
    h += '</div>';
    h += '<div style="font-size:12px;margin-bottom:8px;font-weight:700">الموضوع: '+x.topic+'</div>';
    h += '<div style="font-size:12px;background:#FAFAF5;border:1px solid var(--bd);border-radius:10px;padding:12px;white-space:pre-wrap;line-height:1.8">'+H(x.message)+'</div>';
    h += '<div class="fg" style="margin-top:14px"><label>تغيير حالة الطلب</label><select id="sup-status"><option value="جديد" '+(x.status==='جديد'?'selected':'')+'>🟡 جديد</option><option value="قيد المعالجة" '+(x.status==='قيد المعالجة'?'selected':'')+'>🔵 قيد المعالجة</option><option value="تم" '+(x.status==='تم'?'selected':'')+'>✅ تم</option></select></div>';
    document.getElementById('m-title').innerText = '📄 طلب تواصل - '+x.id;
    document.getElementById('m-body').innerHTML = h;
    document.getElementById('m-foot').innerHTML = '<button class="btn btn-g" onclick="updateSupportStatus(\''+x.id+'\')">💾 حفظ الحالة</button> <button class="btn btn-o" onclick="closeM()">إغلاق</button>';
    document.getElementById('modal').classList.add('open');
}

async function updateSupportStatus(id) {
    try {
        var doc = await db.collection("system_control").doc("support_requests").get();
        var list = (doc.exists && doc.data().list) ? doc.data().list : [];
        var idx = list.findIndex(function(x){return x.id===id;});
        if(idx === -1) { toast('الطلب غير موجود', 'e'); return; }
        list[idx].status = document.getElementById('sup-status').value;
        await db.collection("system_control").doc("support_requests").set({ list: list });
        toast('✅ تم تحديث حالة الطلب', 's');
        closeM();
        loadSupportRequests();
        loadActivationRequests();
    } catch(e) { toast('خطأ في الحفظ', 'e'); }
}

function showTenantModal(id) {
    var t = id ? window.tenantsCache.find(x => x.id === id) : {};
    var h = '<div class="fg"><label>اسم المنشأة</label><input id="t-name" value="'+(t.name||'')+'"></div>';
    h += '<div class="fg"><label>رمز المنشأة (إنجليزي بدون مسافات)</label><input id="t-code" value="'+(t.id?t.id.replace('NUR-',''):'')+'" '+(id?'disabled':'')+'></div>';
    h += '<div class="fg"><label>نوع النشاط</label><select id="t-type"><option value="nursery" '+(t.type==='nursery'?'selected':'')+'>🌱 مشتل</option><option value="factory" '+(t.type==='factory'?'selected':'')+'>🏭 مصنع</option><option value="retail" '+(t.type==='retail'?'selected':'')+'>🛒 تجارة</option><option value="restaurant" '+(t.type==='restaurant'?'selected':'')+'>🍽️ مطعم</option></select></div>';
    h += '<div class="fg"><label>تاريخ تجديد الاشتراك</label><input type="date" id="t-renewal" value="'+(t.renewalDate||'')+'"></div>';
    document.getElementById('m-title').innerText = id ? 'تعديل منشأة' : 'إضافة منشأة';
    document.getElementById('m-body').innerHTML = h;
    document.getElementById('modal').classList.add('open');
}

async function openFeatsModal(id) {
    try {
        var doc = await db.collection("tenants").doc(id).get();
        var data = doc.exists ? doc.data() : {};
        var feats = data.features || {};
        var h = '<div style="font-size:12px;color:var(--fg2);margin-bottom:15px">تحكم بتفعيل وإيقاف ميزات النظام لهذه المنشأة. الإيقاف يخفي الميزة فقط ولا يحذف بياناتها.</div>';
        FEATURES_DEF.forEach(function(f) {
            var on = feats[f.key] !== false;
            h += '<label style="display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;cursor:pointer;background:' + (on ? 'var(--gnl)' : 'var(--bg)') + '">';
            h += '<input type="checkbox" class="feat-cb" data-key="' + f.key + '" ' + (on ? 'checked' : '') + ' style="width:20px;height:20px;accent-color:var(--gn)">';
            h += '<div style="flex:1"><div style="font-size:12px;font-weight:700">' + f.icon + ' ' + f.name + '</div><div style="font-size:10px;color:var(--mt)">' + f.desc + '</div></div>';
            h += '<span style="font-size:11px;font-weight:700;color:' + (on ? 'var(--gn)' : 'var(--dn)') + '">' + (on ? '✅ مفعلة' : '🔴 موقفة') + '</span></label>';
        });
        document.getElementById('m-title').innerText = '⚙️ ميزات المنشأة: ' + (data.name || id);
        document.getElementById('m-body').innerHTML = h;
        document.getElementById('m-foot').innerHTML = '<button class="btn btn-g" onclick="saveFeats(\'' + id + '\')">💾 حفظ الميزات</button> <button class="btn btn-o" onclick="closeM()">إلغاء</button>';
        document.querySelectorAll('.feat-cb').forEach(function(cb) {
            cb.addEventListener('change', function() {
                var lbl = this.closest('label');
                var on = this.checked;
                lbl.style.background = on ? 'var(--gnl)' : 'var(--bg)';
                lbl.querySelector('span').innerText = on ? '✅ مفعلة' : '🔴 موقفة';
                lbl.querySelector('span').style.color = on ? 'var(--gn)' : 'var(--dn)';
            });
        });
        document.getElementById('modal').classList.add('open');
    } catch(e) { toast('خطأ في تحميل الميزات', 'e'); }
}
function closeM() { document.getElementById('modal').classList.remove('open'); }
function openModal(title, bodyHtml, footHtml) {
    document.getElementById('m-title').innerText = title;
    document.getElementById('m-body').innerHTML = bodyHtml;
    document.getElementById('m-foot').innerHTML = footHtml || '<button class="btn btn-o" onclick="closeM()">إغلاق</button>';
    document.getElementById('modal').classList.add('open');
}

async function saveTenant() {
    var name = document.getElementById('t-name').value;
    var code = document.getElementById('t-code').value;
    if(!name || !code) { toast('أدخل الاسم والرمز', 'e'); return; }
    var id = 'NUR-' + code.trim().toUpperCase();
    var newT = { id: id, name: name, type: document.getElementById('t-type').value, renewalDate: document.getElementById('t-renewal').value, status: 'active' };
    try {
        var docRef = db.collection("system_control").doc("all_tenants");
        var doc = await docRef.get();
        var arr = (doc.exists && doc.data().list) ? doc.data().list : [];
        var idx = arr.findIndex(x => x.id === id);
        if(idx > -1) arr[idx] = newT; else arr.push(newT);
        await docRef.set({ list: arr }, { merge: true });
        toast('✅ تم الحفظ', 's');
        closeM();
        loadTenants();
    } catch(e) { toast('خطأ في الحفظ', 'e'); }
}

async function approveTenant(id) {
    try {
        var docRef = db.collection("system_control").doc("all_tenants");
        var doc = await docRef.get();
        var arr = (doc.exists && doc.data().list) ? doc.data().list : [];
        var idx = arr.findIndex(x => x.id === id);
        if(idx > -1) {
            arr[idx].status = 'active';
            arr[idx].renewalDate = new Date(new Date().setFullYear(new Date().getFullYear() + 1)).toISOString().split('T')[0];
            await docRef.set({ list: arr }, { merge: true });
            toast('✅ تم تفعيل المنشأة', 's');
            loadTenants();
        }
    } catch(e) { toast('خطأ', 'e'); }
}

async function saveFeats(id) {
    try {
        var feats = {};
        FEATURES_DEF.forEach(function(f) {
            var cb = document.querySelector('.feat-cb[data-key="' + f.key + '"]');
            feats[f.key] = cb ? cb.checked : true;
        });
        await db.collection("tenants").doc(id).update({ features: feats });
        var docRef = db.collection("system_control").doc("all_tenants");
        var doc = await docRef.get();
        var arr = (doc.exists && doc.data().list) ? doc.data().list : [];
        var idx = arr.findIndex(x => x.id === id);
        if(idx > -1) { arr[idx].features = feats; await docRef.set({ list: arr }, { merge: true }); }
        toast('✅ تم حفظ ميزات المنشأة', 's');
        closeM();
    } catch(e) { toast('خطأ في حفظ الميزات', 'e'); }
}
function H(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
async function toggleSupportBtn(enabled) {
    try {
        await db.collection("system_control").doc("owner_config").set({ supportEnabled: enabled }, { merge: true });
        document.getElementById('support-toggle-lbl').innerText = enabled ? '✅ مفعّل' : '🔴 معطّل';
        toast(enabled ? '✅ تم تفعيل زر التواصل' : '🔴 تم إيقاف زر التواصل', 's');
    } catch(e) { toast('خطأ في الحفظ', 'e'); }
}
checkLogin();
