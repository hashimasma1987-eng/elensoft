<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="512x512" href="icon_512.png">
<link rel="apple-touch-icon" href="icon_512.png">
<meta name="theme-color" content="#162B1E">
<title>ELEN SOFT - نظام إدارة المشتات</title>
<style>
:root{--bg:#F0EDE6;--card:#fff;--hd:#162B1E;--fg:#1A2E1A;--mt:#8A9A8A;--ac:#C45D3E;--gn:#2D6B45;--bd:#D8D2C8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--hd);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{background:var(--card);border-radius:24px;width:100%;max-width:420px;padding:35px 30px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.logo{background:var(--hd);border-radius:14px;padding:20px;margin-bottom:22px}
.logo img{max-width:180px;height:50px;object-fit:contain}
.title{font-size:18px;font-weight:900;color:var(--hd);margin-bottom:6px}
.sub{font-size:12px;color:var(--mt);margin-bottom:25px}
.btn{display:flex;align-items:center;gap:10px;width:100%;padding:14px 18px;border:none;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;text-decoration:none;margin-bottom:12px;transition:transform .15s;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn:hover{transform:translateY(-2px)}
.btn.hidden{display:none!important}
.btn-o{background:#2D6B45;color:#fff}
.btn-t{background:#C62828;color:#fff}
.btn .ic{font-size:20px}
.note{font-size:10px;color:var(--mt);margin-top:10px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
    <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" height="40" style="width:auto;max-width:200px;">
          <defs>
            <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#2D6B45;stop-opacity:1" /><stop offset="100%" style="stop-color:#1A2E1A;stop-opacity:1" /></linearGradient>
            <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#E8735A;stop-opacity:1" /><stop offset="100%" style="stop-color:#C45D3E;stop-opacity:1" /></linearGradient>
          </defs>
          <g transform="skewX(-12) translate(45, 0)">
            <g transform="translate(10, 10)">
              <path d="M 5 80 L 5 95 L 55 95" stroke="#1A2E1A" stroke-width="4" fill="none" stroke-linecap="round"/>
              <rect x="10" y="65" width="8" height="25" rx="4" fill="url(#greenGrad)"/>
              <rect x="22" y="45" width="8" height="45" rx="4" fill="url(#greenGrad)"/>
              <path d="M 34 95 L 34 35 C 34 20, 45 10, 55 5 C 45 15, 40 25, 38 35 Z" fill="url(#orangeGrad)"/>
              <path d="M 38 80 L 38 40" stroke="#fff" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
            </g>
          </g>
          <g transform="translate(120, 10) skewX(-12)">
            <text x="5" y="45" font-family="system-ui,-apple-system,sans-serif" font-size="52" font-weight="900" fill="#fff" letter-spacing="2">ELIN</text>
            <line x1="141" y1="-15" x2="149" y2="12" stroke="#C45D3E" stroke-width="5" stroke-linecap="round"/>
            <text x="158" y="0" font-family="system-ui,-apple-system,sans-serif" font-size="52" font-weight="300" fill="#C45D3E" letter-spacing="2">SOFT</text>
          </g>
        </svg>
    </div>
    <div class="title">نظام ELEN SOFT المحاسبي</div>
    <div class="sub">منصة إدارة متكاملة - اختر نوع الدخول</div>
    <a href="tenant.html" class="btn btn-o" id="btn1" style="display:none"><span class="ic">1</span>دخول 1</a>
    <a href="owner.html" class="btn btn-t" id="btn2"><span class="ic">2</span>دخول 2</a>
    <div class="note" id="note">ادخل من الزر الأخضر (1) أو الزر الأحمر (2)</div>
<script>
(function(){
    // منع النسخ والتحديد على الأزرار
    var btns=document.querySelectorAll('.btn');
    btns.forEach(function(b){
        b.addEventListener('selectstart',function(e){e.preventDefault()});
        b.addEventListener('contextmenu',function(e){e.preventDefault()});
        b.addEventListener('dragstart',function(e){e.preventDefault()});
        b.addEventListener('copy',function(e){e.preventDefault()});
        b.addEventListener('touchstart',function(){} ,{passive:true});
    });
    var installed = localStorage.getItem('elen_installed');
    var ownerDone = localStorage.getItem('elen_owner_done');
    if(installed && !ownerDone){
        // المستأجر ثبت النظام: تتخطى هذه الصفحة ويدخل النظام مباشرة
        window.location.replace('tenant.html');
    }
    if(installed && ownerDone){
        // المالك دخل سابقًا: يختفي زر المالك (الأحمر) فقط، ويبقى الأخضر للمستأجر
        document.getElementById('btn2').style.display='none';
        document.getElementById('btn1').style.display='flex';
        document.getElementById('note').innerHTML='تم تثبيت النظام على هذا الجهاز';
    } else if(installed && !ownerDone){
        // النظام مثبت ولم يدخل المالك بعد: يظهر زر المالك (الأحمر) مرة واحدة فقط
        document.getElementById('btn2').style.display='flex';
        document.getElementById('btn1').style.display='none';
        document.getElementById('note').innerHTML='لمرة واحدة فقط: ادخل من الزر الأحمر (2)';
    } else {
        // لم يثبت النظام بعد: يظهر دخول المستأجر (الأخضر) فقط
        document.getElementById('btn1').style.display='flex';
        document.getElementById('btn2').style.display='none';
        document.getElementById('note').innerHTML='بعد تثبيت النظام سيظهر دخول 2';
    }
})();
</script>
</div>
</body>
</html>
